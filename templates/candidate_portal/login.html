{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidate Login — Sky Vision Consultancy</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }
    .auth-card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      max-width: 440px;
      width: 100%;
      overflow: hidden;
    }
    .auth-header {
      background: #0f172a;
      color: #ffffff;
      padding: 32px;
      text-align: center;
    }
    .auth-body {
      padding: 32px;
    }
    .form-label {
      font-weight: 600;
      font-size: 0.88rem;
      color: #334155;
    }
    .form-control {
      border-radius: 10px;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
    }
    .form-control:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.15);
    }
    .btn-submit {
      background: #0d6efd;
      border: none;
      color: #fff;
      font-weight: 700;
      padding: 12px;
      border-radius: 10px;
      width: 100%;
      transition: background 0.2s;
    }
    .btn-submit:hover {
      background: #0b5ed7;
    }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="auth-header">
    <a href="/" class="d-inline-block bg-white px-3 py-2 rounded-pill shadow-sm mb-2 text-decoration-none">
      <img src="{% static 'images/logo/logo.png' %}" alt="Sky Vision Logo" style="height:38px; object-fit:contain;" onerror="this.style.display='none'">
    </a>
    <h3 class="mt-2 mb-1 fw-bold text-white">Candidate Portal</h3>
    <p class="mb-0 text-white-50 fs-6">Sign in to your candidate account</p>
  </div>

  <div class="auth-body">
    <div id="alertBox" class="alert d-none" role="alert"></div>

    <form id="loginForm">
      <input type="hidden" name="next" value="{{ next }}">

      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-envelope"></i></span>
          <input type="email" class="form-control" name="email" placeholder="registered@email.com" required>
        </div>
      </div>

      <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label class="form-label mb-0">Password</label>
          <a href="/candidate/forgot-password/" class="text-primary text-decoration-none small">Forgot Password?</a>
        </div>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-lock"></i></span>
          <input type="password" class="form-control" name="password" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn btn-submit mt-2" id="btnLogin">
        <span id="spinner" class="spinner-border spinner-border-sm d-none me-2"></span>
        Sign In
      </button>
    </form>

    <div class="text-center mt-4 pt-3 border-top">
      <p class="mb-0 text-muted">Don't have an account? <a href="/candidate/register/" class="fw-bold text-primary text-decoration-none">Register Here</a></p>
    </div>
  </div>
</div>

<script>
  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const alertBox = document.getElementById('alertBox');
    const btnLogin = document.getElementById('btnLogin');
    const spinner = document.getElementById('spinner');

    alertBox.className = 'alert d-none';
    btnLogin.disabled = true;
    spinner.classList.remove('d-none');

    const formData = new FormData(this);

    try {
      const response = await fetch('/api/candidate/login/', {
        method: 'POST',
        headers: {
          'X-CSRFToken': getCookie('csrftoken') || ''
        },
        body: formData
      });
      const data = await response.json();

      if (response.ok && data.status === 'success') {
        alertBox.className = 'alert alert-success d-block';
        alertBox.innerHTML = `<strong><i class="fa-solid fa-check-circle me-1"></i>Login Successful!</strong> Redirecting...`;
        setTimeout(() => {
          window.location.href = data.redirect_url || '/candidate/dashboard/';
        }, 500);
      } else {
        alertBox.className = 'alert alert-warning d-block';
        alertBox.innerHTML = `<strong><i class="fa-solid fa-circle-exclamation me-1"></i>Login Failed:</strong> ${data.message || 'Invalid credentials.'}`;
      }
    } catch (err) {
      alertBox.className = 'alert alert-danger d-block';
      alertBox.innerHTML = `<strong>Error:</strong> Network connection failed.`;
    } finally {
      btnLogin.disabled = false;
      spinner.classList.add('d-none');
    }
  });

  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        if (cookie.substring(0, name.length + 1) === (name + '=')) {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }
</script>
</body>
</html>
