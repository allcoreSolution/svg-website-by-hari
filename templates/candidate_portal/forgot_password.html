{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Sky Vision Candidate Portal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }
    .auth-card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      max-width: 440px;
      width: 100%;
      overflow: hidden;
    }
    .auth-header {
      background: #0f172a;
      color: #ffffff;
      padding: 32px;
      text-align: center;
    }
    .auth-body {
      padding: 32px;
    }
    .form-control {
      border-radius: 10px;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
    }
    .btn-submit {
      background: #0d6efd;
      border: none;
      color: #fff;
      font-weight: 700;
      padding: 12px;
      border-radius: 10px;
      width: 100%;
    }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="auth-header">
    <h3 class="mt-2 mb-1 fw-bold text-white">Reset Password</h3>
    <p class="mb-0 text-white-50 fs-6">Enter your registered email address</p>
  </div>

  <div class="auth-body">
    <div id="alertBox" class="alert d-none" role="alert"></div>

    <form id="forgotForm">
      <div class="mb-3">
        <label class="form-label fw-semibold">Email Address</label>
        <input type="email" class="form-control" name="email" placeholder="your@email.com" required>
      </div>

      <button type="submit" class="btn btn-submit" id="btnSubmit">
        <span id="spinner" class="spinner-border spinner-border-sm d-none me-2"></span>
        Send Reset Link
      </button>
    </form>

    <div class="text-center mt-4 pt-3 border-top">
      <a href="/candidate/login/" class="text-muted text-decoration-none fw-semibold"><i class="fa-solid fa-arrow-left me-1"></i> Back to Login</a>
    </div>
  </div>
</div>

<script>
  document.getElementById('forgotForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const alertBox = document.getElementById('alertBox');
    const btnSubmit = document.getElementById('btnSubmit');
    const spinner = document.getElementById('spinner');

    alertBox.className = 'alert d-none';
    btnSubmit.disabled = true;
    spinner.classList.remove('d-none');

    const formData = new FormData(this);

    try {
      const response = await fetch('/api/candidate/forgot-password/', {
        method: 'POST',
        headers: { 'X-CSRFToken': getCookie('csrftoken') || '' },
        body: formData
      });
      const data = await response.json();

      alertBox.className = 'alert alert-info d-block';
      alertBox.innerHTML = `<strong>Status:</strong> ${data.message}`;
    } catch (err) {
      alertBox.className = 'alert alert-danger d-block';
      alertBox.innerHTML = `<strong>Error:</strong> Request failed.`;
    } finally {
      btnSubmit.disabled = false;
      spinner.classList.add('d-none');
    }
  });

  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        if (cookie.substring(0, name.length + 1) === (name + '=')) {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }
</script>
</body>
</html>
